# Autoklinik Bludau – Zeiterfassung
# Start:  docker compose up -d --build
# Werte kommen aus .env (siehe .env.example; auf dem Server erzeugt install.sh sie)

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: zeit
      POSTGRES_USER: zeit
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD fehlt in .env}
      TZ: Europe/Berlin
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zeit -d zeit"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [intern]

  app:
    build: .
    image: bludau-zeiterfassung:latest
    restart: unless-stopped
    init: true
    depends_on:
      db: { condition: service_healthy }
    environment:
      DATABASE_URL: postgresql://zeit:${DB_PASSWORD}@db:5432/zeit?schema=public
      APP_SECRET: ${APP_SECRET:?APP_SECRET fehlt in .env}
      APP_URL: ${APP_URL:-http://localhost:3000}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      SETUP_TOKEN: ${SETUP_TOKEN:-}
    # lokal erreichbar; auf dem Server nur über den Reverse-Proxy (siehe docker-compose.server.yml)
    ports:
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-3000}:3000"
    networks: [intern]

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      PGHOST: db
      PGDATABASE: zeit
      PGUSER: zeit
      PGPASSWORD: ${DB_PASSWORD}
      TZ: Europe/Berlin
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-30}
      BACKUP_TIME: ${BACKUP_TIME:-02:30}
    volumes:
      - ./backups:/backups
      - ./docker/backup.sh:/backup.sh:ro
    entrypoint: ["/bin/sh", "/backup.sh"]
    networks: [intern]

volumes:
  db-data:

networks:
  intern:

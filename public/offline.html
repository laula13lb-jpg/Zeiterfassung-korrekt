<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Keine Verbindung – Zeiterfassung Bludau</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; background: #062a63; color: #fff; text-align: center; padding: 24px; box-sizing: border-box; }
  img { background: #fff; border-radius: 16px; padding: 8px; height: 120px; }
  h1 { font-size: 28px; margin: 24px 0 8px; }
  p { font-size: 18px; max-width: 32rem; }
  button { margin-top: 24px; min-height: 64px; padding: 0 32px; border: 0; border-radius: 16px; background: #ffcc00; color: #041a3d; font-size: 20px; font-weight: 800; }
</style>
</head>
<body>
  <main>
    <img src="/logo.jpg" alt="Bludau – Die Auto-Klinik">
    <h1>Keine Verbindung</h1>
    <p>Die Zeiterfassung ist gerade nicht erreichbar. Bitte WLAN/mobile Daten prüfen und gleich noch einmal versuchen.</p>
    <p>Am Werkstatt-Terminal werden Stempelungen bei kurzem Netzausfall automatisch gespeichert und nachgereicht.</p>
    <button onclick="location.reload()">Erneut versuchen</button>
  </main>
</body>
</html>
